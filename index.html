<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐯 猛虎死循环</title>
    <style>
        * { margin:0; padding:0; overflow:hidden; background:#0a0a1a; }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a1a 100%);
            cursor: none;
        }
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff5500;
            font: 20px 'Arial Black', sans-serif;
            text-shadow: 0 0 30px #ff5500, 0 0 60px #ff2200;
            background: rgba(0,0,0,0.7);
            padding: 14px 32px;
            border-radius: 50px;
            border: 2px solid #ff5500;
            z-index: 999;
            white-space: nowrap;
            animation: pulse 1.2s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.7; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="toast">🔥 老虎永不掉头 · 撞墙算我输</div>

    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            let W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Tiger {
                constructor() {
                    this.size = Math.min(W, H) / 9;
                    this.x = Math.random() * (W - this.size * 2) + this.size;
                    this.y = Math.random() * (H - this.size * 2) + this.size;
                    // 初始角度随机，但保证不会卡死
                    this.angle = Math.random() * Math.PI * 2;
                    this.speed = 2.0 + Math.random() * 2.5;
                    this.tailWag = 0;
                    this.changeDirTimer = 0;
                }

                update() {
                    // 每30~50帧随机变向（增加随机性）
                    this.changeDirTimer++;
                    if (this.changeDirTimer > 30 + Math.random() * 40) {
                        this.angle += (Math.random() - 0.5) * 1.0;
                        this.changeDirTimer = 0;
                    }

                    // 计算下一帧位置
                    let newX = this.x + Math.cos(this.angle) * this.speed;
                    let newY = this.y + Math.sin(this.angle) * this.speed;

                    // 边界检测 —— 撞墙后强制掉头（硬反弹）
                    const half = this.size * 1.1;
                    if (newX < half) {
                        newX = half;
                        this.angle = -this.angle + Math.PI; // 反向
                    }
                    if (newX > W - half) {
                        newX = W - half;
                        this.angle = -this.angle + Math.PI;
                    }
                    if (newY < half) {
                        newY = half;
                        this.angle = Math.PI - this.angle;
                    }
                    if (newY > H - half) {
                        newY = H - half;
                        this.angle = Math.PI - this.angle;
                    }

                    this.x = newX;
                    this.y = newY;

                    // 尾巴摇摆
                    this.tailWag += 0.12;
                }

                draw() {
                    const s = this.size;
                    const x = this.x;
                    const y = this.y;
                    const angle = this.angle;

                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(angle);

                    // 霓虹光效
                    ctx.shadowColor = '#ff8800';
                    ctx.shadowBlur = 35;

                    // 身体
                    ctx.fillStyle = '#ff8800';
                    ctx.shadowBlur = 45;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, s * 0.9, s * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // 条纹
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = '#111';
                    for (let i = -2; i <= 2; i++) {
                        ctx.fillRect(i * s * 0.3 - s * 0.05, -s * 0.5, s * 0.1, s * 0.4);
                    }

                    // 头
                    ctx.fillStyle = '#ff9900';
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(s * 0.7, -s * 0.1, s * 0.45, 0, Math.PI * 2);
                    ctx.fill();

                    // 耳朵
                    ctx.fillStyle = '#cc6600';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.moveTo(s * 0.9, -s * 0.45);
                    ctx.lineTo(s * 1.1, -s * 0.15);
                    ctx.lineTo(s * 0.7, -s * 0.15);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(s * 0.5, -s * 0.45);
                    ctx.lineTo(s * 0.3, -s * 0.15);
                    ctx.lineTo(s * 0.7, -s * 0.15);
                    ctx.fill();

                    // 眼睛发光
                    ctx.shadowBlur = 35;
                    ctx.shadowColor = '#00ffcc';
                    ctx.fillStyle = '#00ffcc';
                    ctx.beginPath();
                    ctx.arc(s * 0.85, -s * 0.15, s * 0.1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(s * 0.55, -s * 0.15, s * 0.1, 0, Math.PI * 2);
                    ctx.fill();

                    // 瞳孔
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ff00ff';
                    ctx.fillStyle = '#ff00ff';
                    ctx.beginPath();
                    ctx.arc(s * 0.87, -s * 0.15, s * 0.04, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(s * 0.57, -s * 0.15, s * 0.04, 0, Math.PI * 2);
                    ctx.fill();

                    // 嘴巴
                    ctx.shadowBlur = 5;
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(s * 0.7, s * 0.05, s * 0.12, 0.1, Math.PI - 0.1);
                    ctx.stroke();

                    // 尾巴
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#ff8800';
                    ctx.strokeStyle = '#ff7700';
                    ctx.lineWidth = s * 0.12;
                    ctx.beginPath();
                    const wag = Math.sin(this.tailWag) * 0.25;
                    ctx.moveTo(-s * 0.8, s * 0.1);
                    ctx.quadraticCurveTo(
                        -s * 1.2 - s * 0.25 * wag,
                        -s * 0.25 + s * 0.3 * wag,
                        -s * 1.0 - s * 0.35 * wag,
                        s * 0.3 + s * 0.25 * wag
                    );
                    ctx.stroke();

                    // 胡须
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ffffff';
                    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                    ctx.lineWidth = 1.2;
                    for (let side = -1; side <= 1; side += 2) {
                        ctx.beginPath();
                        ctx.moveTo(s * 0.5, s * 0.0);
                        ctx.lineTo(s * 0.8 + side * s * 0.15, s * 0.15);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(s * 0.5, s * 0.05);
                        ctx.lineTo(s * 0.8 + side * s * 0.15, s * 0.3);
                        ctx.stroke();
                    }

                    ctx.restore();
                }
            }

            // 创建5只老虎，保证满屏乱窜
            const tigers = [];
            for (let i = 0; i < 5; i++) {
                const t = new Tiger();
                t.size = (Math.min(W, H) / 10) * (0.6 + Math.random() * 0.7);
                t.speed = 1.8 + Math.random() * 3.2;
                t.x = Math.random() * (W - t.size * 2) + t.size;
                t.y = Math.random() * (H - t.size * 2) + t.size;
                t.angle = Math.random() * Math.PI * 2;
                tigers.push(t);
            }

            function animate() {
                ctx.clearRect(0, 0, W, H);

                // 背景星星
                for (let i = 0; i < 80; i++) {
                    const sx = (i * 173.1 + Date.now() * 0.008) % W;
                    const sy = (i * 109.7 + Date.now() * 0.004) % H;
                    const bright = 0.3 + 0.7 * Math.sin(i + Date.now() * 0.003);
                    ctx.fillStyle = `rgba(255,255,255,${bright * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(sx, sy, 1.2 + bright * 1.8, 0, Math.PI * 2);
                    ctx.fill();
                }

                tigers.forEach(t => {
                    t.update();
                    t.draw();
                });

                requestAnimationFrame(animate);
            }

            animate();

            window.addEventListener('resize', () => {
                resize();
                tigers.forEach(t => {
                    t.x = Math.min(t.x, W - t.size);
                    t.y = Math.min(t.y, H - t.size);
                    t.size = (Math.min(W, H) / 10) * (0.6 + Math.random() * 0.7);
                });
            });

        })();
    </script>
</body>
</html>
