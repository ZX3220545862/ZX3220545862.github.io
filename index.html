<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>91.78.13</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0b0e1a;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 20% 30%, #1a1f33, #070a12);
            cursor: default;
            position: relative;
            z-index: 1;
        }
        #center-image {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 60px rgba(255, 200, 150, 0.4), 0 0 120px rgba(255, 150, 100, 0.2);
            z-index: 10;
            pointer-events: none;
            animation: floatGlow 4s ease-in-out infinite alternate;
            border: 3px solid rgba(255, 220, 180, 0.3);
        }
        @keyframes floatGlow {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); box-shadow: 0 0 40px rgba(255, 200, 150, 0.3); }
            100% { transform: translate(-50%, -50%) scale(1.06) rotate(4deg); box-shadow: 0 0 80px rgba(255, 200, 150, 0.6); }
        }
        #info {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 220, 180, 0.4);
            font: 14px 'Courier New', monospace;
            letter-spacing: 4px;
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 0 20px rgba(255, 200, 150, 0.15);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <!-- 中央图片（替换 src 为自己的图） -->
    <img id="center-image" src="https://raw.githubusercontent.com/ZX3220545862/ZX3220545862.github.io/main/output.webp" alt="中央图">
    <div id="info">❄️老不斯</div>

    <script>
        (function() {
            // ========== 画布 ==========
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            let W, H;
            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // ========== 名字列表 ==========
            const nameList = [
                '范新宇', '范新宇', 'Your life is dying soon.', '范新宇', '范新宇',
                '范新宇', '我死的好惨', '范新宇', '范新宇', '范新宇',
                '范新宇', '范新宇', '拿命来', '范新宇', '范新宇',
                '💀💀💀', '范新宇', '范新宇', '范新宇', '范新宇'
            ];

            // ========== 雪花粒子 ==========
            class NameSnow {
                constructor() {
                    this.name = nameList[Math.floor(Math.random() * nameList.length)];
                    this.size = 14 + Math.random() * 16;
                    this.x = Math.random() * (W - 60) + 30;
                    this.y = -this.size - Math.random() * 200;
                    this.speedY = 0.8 + Math.random() * 1.8;
                    this.speedX = (Math.random() - 0.5) * 0.6;
                    this.opacity = 0.3 + Math.random() * 0.6;
                    this.rotation = (Math.random() - 0.5) * 0.3;
                    this.color = `hsl(${30 + Math.random() * 30}, 70%, ${60 + Math.random() * 30}%)`;
                }

                update() {
                    this.y += this.speedY;
                    this.x += this.speedX + Math.sin(this.y * 0.008) * 0.3;
                    if (this.y > H + 50) {
                        this.y = -this.size - Math.random() * 100;
                        this.x = Math.random() * (W - 60) + 30;
                        this.name = nameList[Math.floor(Math.random() * nameList.length)];
                        this.speedY = 0.8 + Math.random() * 2.0;
                        this.opacity = 0.3 + Math.random() * 0.6;
                    }
                    if (this.x < -60) this.x = W + 30;
                    if (this.x > W + 60) this.x = -30;
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.globalAlpha = this.opacity * 0.9;
                    ctx.shadowColor = 'rgba(180, 220, 255, 0.5)';
                    ctx.shadowBlur = 25;
                    ctx.font = `bold ${this.size}px 'PingFang SC', 'Microsoft YaHei', sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const grad = ctx.createLinearGradient(-this.size, -this.size, this.size, this.size);
                    grad.addColorStop(0, this.color);
                    grad.addColorStop(1, '#ffd8b0');
                    ctx.fillStyle = grad;
                    ctx.fillText(this.name, 0, 0);
                    ctx.shadowBlur = 40;
                    ctx.shadowColor = 'rgba(255, 200, 150, 0.2)';
                    ctx.fillText(this.name, 0, 0);
                    ctx.restore();
                }
            }

            // ========== 生成雪花 ==========
            const snowflakes = [];
            const count = Math.min(80, Math.floor(W * H / 18000));
            for (let i = 0; i < count; i++) {
                const s = new NameSnow();
                s.y = Math.random() * H - H;
                s.size = 12 + Math.random() * 18;
                s.speedY = 0.6 + Math.random() * 2.2;
                snowflakes.push(s);
            }

            // ========== 音乐引擎（Lofi） ==========
            let audioCtx = null;
            let oscillator1, oscillator2, gainNode, filterNode;
            let intervalId = null;

            function initAudio() {
                if (audioCtx) return;
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    gainNode = audioCtx.createGain();
                    gainNode.gain.value = 0.25;
                    gainNode.connect(audioCtx.destination);
                    filterNode = audioCtx.createBiquadFilter();
                    filterNode.type = 'lowpass';
                    filterNode.frequency.value = 800;
                    filterNode.Q.value = 1.2;
                    filterNode.connect(gainNode);
                    oscillator1 = audioCtx.createOscillator();
                    oscillator1.type = 'sawtooth';
                    oscillator1.frequency.value = 130.81;
                    oscillator1.connect(filterNode);
                    oscillator2 = audioCtx.createOscillator();
                    oscillator2.type = 'sine';
                    oscillator2.frequency.value = 196.00;
                    oscillator2.connect(filterNode);
                    oscillator1.start();
                    oscillator2.start();

                    const chords = [
                        [130.81, 196.00],
                        [146.83, 220.00],
                        [164.81, 246.94],
                        [174.61, 261.63],
                    ];
                    let idx = 0;
                    intervalId = setInterval(() => {
                        const chord = chords[idx % chords.length];
                        oscillator1.frequency.setTargetAtTime(chord[0], audioCtx.currentTime, 0.05);
                        oscillator2.frequency.setTargetAtTime(chord[1], audioCtx.currentTime, 0.05);
                        idx++;
                    }, 2400);
                    setTimeout(() => {
                        if (oscillator1) oscillator1.detune.value = 2.5;
                        if (oscillator2) oscillator2.detune.value = -1.8;
                    }, 500);
                } catch (e) {
                    console.warn('音频启动失败:', e);
                }
            }

            canvas.addEventListener('click', () => {
                if (!audioCtx) initAudio();
                else if (audioCtx.state === 'suspended') audioCtx.resume();
            });
            canvas.addEventListener('touchstart', () => {
                if (!audioCtx) initAudio();
                else if (audioCtx.state === 'suspended') audioCtx.resume();
            });

            // ========== 动画 ==========
            function animate() {
                ctx.clearRect(0, 0, W, H);
                const grad = ctx.createRadialGradient(W*0.3, H*0.2, 50, W*0.5, H*0.5, W*0.9);
                grad.addColorStop(0, '#1a2744');
                grad.addColorStop(0.5, '#0f1a2e');
                grad.addColorStop(1, '#060a14');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                snowflakes.forEach(s => {
                    s.update();
                    s.draw();
                });

                requestAnimationFrame(animate);
            }
            animate();

            window.addEventListener('beforeunload', () => {
                if (intervalId) clearInterval(intervalId);
                if (audioCtx) { try { audioCtx.close(); } catch(e) {} }
            });

        })();
    </script>
</body>
</html>
